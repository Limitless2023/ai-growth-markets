<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Growth Markets · AI 催生的新岗位与增量市场</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-soft: #121829;
    --card: #161d31;
    --card-hover: #1c2540;
    --border: #25304d;
    --text: #eef2fb;
    --text-dim: #9aa6c4;
    --accent: #6ea8fe;
    --role: #7ee0c0;
    --market: #ffb86b;
    --emerging: #8b9bd4;
    --growing: #6ea8fe;
    --established: #7ee0c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2440 0%, transparent 60%), var(--bg);
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    padding: 64px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--bg-soft), transparent);
  }
  header h1 {
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -0.5px;
    background: linear-gradient(120deg, #eef2fb, #6ea8fe);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--text-dim); margin-top: 12px; font-size: 16px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .stats { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; }
  .stat b { font-size: 22px; color: var(--accent); }
  .stat span { color: var(--text-dim); font-size: 13px; display: block; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 28px 0; }
  .chip {
    background: var(--card); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 16px; font-size: 14px; cursor: pointer; transition: .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #0b0f19; border-color: var(--accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    transition: .18s; display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-3px); border-color: var(--accent); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card h3 { font-size: 17px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .badge.role { background: rgba(126,224,192,.15); color: var(--role); }
  .badge.market { background: rgba(255,184,107,.15); color: var(--market); }
  .badge.domain { background: rgba(110,168,254,.12); color: var(--accent); }
  .badge.maturity { border: 1px solid var(--border); color: var(--text-dim); }
  .summary { color: var(--text); font-size: 14px; }
  .why { color: var(--text-dim); font-size: 13px; }
  .why b { color: var(--accent); font-weight: 600; }
  .skills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .skill { font-size: 11px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; color: var(--text-dim); }
  footer { text-align: center; color: var(--text-dim); padding: 40px 24px; font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }
  footer a { color: var(--accent); text-decoration: none; }
  .empty { text-align: center; color: var(--text-dim); padding: 60px; grid-column: 1/-1; }
</style>
</head>
<body>
<header>
  <h1>AI Growth Markets</h1>
  <p>随着 AI 的发展，正在出现哪些新岗位 &amp; 新的增量市场？</p>
  <div class="stats" id="stats"></div>
</header>

<div class="wrap">
  <div class="filters" id="typeFilters"></div>
  <div class="filters" id="domainFilters"></div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  早期立项 · 数据为人工整理的种子样本，使用前请核验来源 ·
  <a href="../README.md">项目说明</a> · <a href="../data/opportunities.json">原始数据</a>
</footer>

<script>
// 数据优先从 ../data/opportunities.json 加载；若以 file:// 方式打开导致加载失败，
// 则使用下方内置的种子副本，保证页面可直接打开预览。
const FALLBACK = {"opportunities":[
{"id":"prompt-engineer","name":"提示词工程师 / Prompt Engineer","type":"role","domain":"product","maturity":"growing","summary":"设计、优化与维护与大模型交互的提示词及工作流，让 AI 稳定产出可用结果。","whyNew":"大模型出现前不存在此岗位；自然语言成为新的编程接口后才规模化。","skills":["LLM 行为理解","评估与 A/B 测试","领域知识建模","基础编程"]},
{"id":"ai-evaluation-engineer","name":"模型评估工程师 / AI Evaluation Engineer","type":"role","domain":"safety","maturity":"growing","summary":"构建评测集与自动化评估管线，量化模型质量、回归与安全性。","whyNew":"模型能力难以用传统软件测试覆盖，催生专门的 evals 角色与工具链。","skills":["统计与实验设计","数据集构建","LLM-as-judge","MLOps"]},
{"id":"ai-red-teamer","name":"AI 红队 / AI Red Teamer","type":"role","domain":"safety","maturity":"growing","summary":"主动攻击模型以发现越狱、有害输出、数据泄露等风险并推动修复。","whyNew":"生成式模型带来全新的攻击面（提示注入、越狱），需要专门对抗性测试。","skills":["对抗性思维","安全攻防","提示注入技术","伦理判断"]},
{"id":"ai-product-manager","name":"AI 产品经理 / AI Product Manager","type":"role","domain":"product","maturity":"established","summary":"负责以模型能力为核心的产品，平衡不确定性、成本、延迟与用户体验。","whyNew":"AI 产品的概率性与成本结构与传统软件不同，需要新的产品方法论。","skills":["LLM 能力边界认知","评估指标设计","成本/延迟权衡","数据飞轮设计"]},
{"id":"ai-trainer-annotator","name":"AI 训练师 / 数据标注与对齐专家","type":"role","domain":"data","maturity":"growing","summary":"为 RLHF / 偏好对齐生产高质量标注与示范数据，提升模型对齐度。","whyNew":"对齐训练需要大量人类偏好数据，催生专业标注与领域专家众包市场。","skills":["领域专业知识","标注规范执行","判断一致性"]},
{"id":"ai-compliance-officer","name":"AI 合规官 / AI Governance & Compliance","type":"role","domain":"governance","maturity":"emerging","summary":"确保 AI 系统符合法规、内部政策与伦理标准。","whyNew":"AI 专项监管陆续落地，企业需要专门角色负责合规与风险治理。","skills":["法律法规","风险管理","AI 系统理解","审计"]},
{"id":"gpu-cloud","name":"GPU 算力租赁 / GPU Cloud","type":"market","domain":"infrastructure","maturity":"established","summary":"面向训练与推理的 GPU 集群租赁与调度服务。","whyNew":"AI 训练/推理对算力需求爆发，催生独立于传统云的算力新云品类。","skills":["大规模集群运维","网络/存储优化","调度与计费"]},
{"id":"ai-inference-infra","name":"AI 推理基础设施 / Inference Infrastructure","type":"market","domain":"infrastructure","maturity":"growing","summary":"优化大模型推理的延迟、吞吐与成本的中间层（服务、编译、量化）。","whyNew":"模型部署成本高，推理优化成为独立且高价值的工具与服务品类。","skills":["推理优化","量化/蒸馏","GPU 内核","服务化"]},
{"id":"vector-database","name":"向量数据库 / Vector Database","type":"market","domain":"infrastructure","maturity":"growing","summary":"存储与检索向量嵌入，为 RAG 等检索增强应用提供基础设施。","whyNew":"RAG 与语义检索普及，使向量存储从功能变为独立基础设施品类。","skills":["向量检索算法 (ANN)","分布式存储","嵌入模型理解"]},
{"id":"synthetic-data","name":"合成数据 / Synthetic Data","type":"market","domain":"data","maturity":"growing","summary":"生成人工数据用于训练/微调，缓解真实数据稀缺与隐私限制。","whyNew":"高质量训练数据接近枯竭，合成数据成为新的数据供给品类。","skills":["数据生成","质量过滤","隐私保护"]},
{"id":"ai-agent-platform","name":"AI Agent 平台 / Agent Infrastructure","type":"market","domain":"product","maturity":"emerging","summary":"构建、编排、监控自主 AI Agent 的框架与运行时（工具调用、记忆、评估）。","whyNew":"Agent 从单次问答转向多步自主执行，需要全新的编排与观测基础设施。","skills":["编排设计","工具/函数调用","可观测性","评估"]},
{"id":"ai-content-detection","name":"AI 内容检测与溯源 / Content Detection","type":"market","domain":"safety","maturity":"emerging","summary":"检测 AI 生成内容、添加水印与溯源，服务教育、媒体与合规场景。","whyNew":"生成内容泛滥带来真实性与版权问题，催生检测与溯源工具市场。","skills":["检测模型","水印技术","内容溯源标准"]}
]};

const DOMAIN_LABEL = {
  infrastructure: "基础设施", data: "数据", product: "产品/应用",
  safety: "安全/对齐", governance: "治理/合规", creative: "创意内容", enablement: "教育/赋能"
};
const TYPE_LABEL = { role: "新岗位", market: "增量市场" };
const MATURITY_LABEL = { emerging: "萌芽", growing: "成长", established: "成熟" };

let DATA = [];
let typeFilter = "all";
let domainFilter = "all";

async function load() {
  try {
    const res = await fetch("../data/opportunities.json", { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    const json = await res.json();
    DATA = json.opportunities;
  } catch (e) {
    DATA = FALLBACK.opportunities;
  }
  renderStats();
  renderFilters();
  render();
}

function renderStats() {
  const roles = DATA.filter(d => d.type === "role").length;
  const markets = DATA.filter(d => d.type === "market").length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${DATA.length}</b><span>条机会</span></div>
    <div class="stat"><b>${roles}</b><span>新岗位</span></div>
    <div class="stat"><b>${markets}</b><span>增量市场</span></div>`;
}

function renderFilters() {
  const types = ["all", "role", "market"];
  document.getElementById("typeFilters").innerHTML = types.map(t =>
    `<button class="chip ${t === typeFilter ? "active" : ""}" data-type="${t}">${t === "all" ? "全部类型" : TYPE_LABEL[t]}</button>`
  ).join("");

  const domains = ["all", ...new Set(DATA.map(d => d.domain))];
  document.getElementById("domainFilters").innerHTML = domains.map(d =>
    `<button class="chip ${d === domainFilter ? "active" : ""}" data-domain="${d}">${d === "all" ? "全部领域" : (DOMAIN_LABEL[d] || d)}</button>`
  ).join("");

  document.querySelectorAll("[data-type]").forEach(b =>
    b.onclick = () => { typeFilter = b.dataset.type; renderFilters(); render(); });
  document.querySelectorAll("[data-domain]").forEach(b =>
    b.onclick = () => { domainFilter = b.dataset.domain; renderFilters(); render(); });
}

function render() {
  const items = DATA.filter(d =>
    (typeFilter === "all" || d.type === typeFilter) &&
    (domainFilter === "all" || d.domain === domainFilter));

  const grid = document.getElementById("grid");
  if (!items.length) { grid.innerHTML = `<div class="empty">没有匹配的机会</div>`; return; }

  grid.innerHTML = items.map(d => `
    <div class="card">
      <div class="card-top">
        <h3>${d.name}</h3>
        <div class="badges">
          <span class="badge ${d.type}">${TYPE_LABEL[d.type]}</span>
        </div>
      </div>
      <div class="badges">
        <span class="badge domain">${DOMAIN_LABEL[d.domain] || d.domain}</span>
        <span class="badge maturity">${MATURITY_LABEL[d.maturity] || d.maturity}</span>
      </div>
      <div class="summary">${d.summary}</div>
      <div class="why"><b>为什么是增量：</b>${d.whyNew}</div>
      <div class="skills">${(d.skills || []).map(s => `<span class="skill">${s}</span>`).join("")}</div>
    </div>`).join("");
}

load();
</script>
</body>
</html>
