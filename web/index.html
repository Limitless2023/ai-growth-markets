<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 新工作账本 · The AI Jobs Ledger — AI 正在创造哪些新工作？</title>
<meta name="description" content="AI 创造侧的公共账本：持续追踪 AI 催生的新岗位、新职业与增量市场。每一行都有来源。The public ledger of what AI is creating — new jobs, new roles, new markets. Every row has a source." />
<meta property="og:title" content="The AI Jobs Ledger · AI 新工作账本" />
<meta property="og:description" content="What is AI creating? Every row has a source. — AI 正在创造哪些新工作？每一行都有来源。" />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ Header ============ -->
<header class="site">
  <div class="left">
    <h1 id="brand">AI 新工作账本</h1>
  </div>
  <nav>
    <a id="methodology-link" href="methodology.html">方法论</a>
    <button id="lang-toggle" type="button">EN</button>
  </nav>
</header>

<!-- ============ Hero: The Number ============ -->
<section class="hero">
  <p id="tagline"></p>
  <div id="the-number">…</div>
  <div id="number-label"></div>
  <div id="number-sub"></div>
  <div id="last-updated"></div>
</section>

<!-- ============ 机构口径参照条 ============ -->
<section class="ref-strip">
  <div class="wrap">
    <div id="ref-label"></div>
    <div id="ref-items"></div>
  </div>
</section>

<!-- ============ 主体三 tab ============ -->
<main class="wrap">
  <div id="tabs"></div>

  <section id="panel-ledger">
    <div class="panel-head"><span class="count" id="ledger-count"></span></div>
    <div class="filters" id="kind-filters"></div>
    <div class="filters" id="region-filters"></div>
    <div class="ledger-wrap">
      <table class="ledger">
        <thead>
          <tr>
            <th data-i18n="colDate">日期</th>
            <th data-i18n="colBody">主体</th>
            <th data-i18n="colWhat">事件</th>
            <th class="num" data-i18n="colCount">岗位数</th>
            <th data-i18n="colRegion">地区</th>
          </tr>
        </thead>
        <tbody id="ledger-body"></tbody>
      </table>
    </div>
  </section>

  <section id="panel-dict" hidden>
    <div class="panel-head"><span class="count" id="dict-count"></span></div>
    <div class="grid" id="dict-grid"></div>
  </section>

  <section id="panel-mkt" hidden>
    <div class="panel-head"><span class="count" id="mkt-count"></span></div>
    <div class="grid" id="mkt-grid"></div>
  </section>
</main>

<!-- ============ Footer ============ -->
<footer class="site">
  <div class="wrap cols">
    <div class="dl">
      <span id="dl-label"></span>
      <a href="data/events.json" download>events.json</a>
      <a href="data/occupations.json" download>occupations.json</a>
      <a href="data/markets.json" download>markets.json</a>
      <a href="data/sources.json" download>sources.json</a>
      <br />
      <a href="https://github.com/Limitless2023/ai-growth-markets" id="gh-link" target="_blank" rel="noopener"></a>
      ·
      <a href="https://github.com/Limitless2023/ai-growth-markets/issues" id="issue-link" target="_blank" rel="noopener"></a>
    </div>
    <div class="cite-box">
      <h4 id="cite-label"></h4>
      <code id="cite-text"></code>
      <button id="cite-btn" type="button"></button>
    </div>
  </div>
  <p id="footer-note"></p>
</footer>

<script type="module">
  // ── 表头双语：app.js 加载前先把静态表头按语言替换 ──
  import { getLang, UI } from "./i18n.js";
  const ui = UI[getLang()];
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = ui[el.dataset.i18n]));
</script>
<script type="module" src="app.js"></script>
</body>
</html>
